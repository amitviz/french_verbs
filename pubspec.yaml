name: french_verbs
description: "French verb conjugation app"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/dictionaries/verbs.json
    - assets/dictionaries/conjugations.json
    - assets/verb_lists/verb_lists.json
    - assets/dictionaries/reverse_dictionary.json

  fonts:
    - family: CharisSIL
      fonts:
        - asset: fonts/CharisSIL-Regular.ttf
        - asset: fonts/CharisSIL-Italic.ttf
          style: italic
        - asset: fonts/CharisSIL-Bold.ttf
          weight: 700
        - asset: fonts/CharisSIL-BoldItalic.ttf
          weight: 700
          style: italic
